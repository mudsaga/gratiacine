<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gratia — Login</title>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;
  --primary:#6366f1;--primary2:#818cf8;--dark:#090d16;--green:#10b981;
  --shadow:0 12px 35px rgba(0,0,0,.3);--radius:20px;
}
[data-theme="light"]{
  --bg:#f1f5f9;--panel:#ffffff;--text:#0f172a;--muted:#64748b;--line:#cbd5e1;
  --primary:#6366f1;--primary2:#4f46e5;--dark:#e2e8f0;--green:#059669;
  --shadow:0 12px 35px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,color .2s;
}

.login-container{
  width:100%;
  max-width:420px;
  padding:24px;
}

.login-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  padding:40px 32px;
  box-shadow:var(--shadow);
}

.login-header{
  text-align:center;
  margin-bottom:32px;
}

.logo-icon{
  font-size:48px;
  margin-bottom:12px;
}

.login-header h1{
  font-size:28px;
  font-weight:900;
  margin:0 0 8px;
  color:var(--text);
}

.login-header p{
  font-size:14px;
  color:var(--muted);
  margin:0;
}

.form-group{
  display:grid;
  gap:12px;
  margin-bottom:20px;
}

.form-group label{
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--muted);
  display:block;
}

.input-box{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  color:var(--text);
  width:100%;
  outline:none;
  transition:border-color .2s;
  font-family:inherit;
}

.input-box:focus{
  border-color:var(--primary);
}

.input-box::placeholder{
  color:var(--muted);
}

.btn-login{
  width:100%;
  height:44px;
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:10px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  transition:all .2s;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.btn-login:hover{
  background:var(--primary2);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(99,102,241,.3);
}

.btn-login:active{
  transform:translateY(0);
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:24px 0;
  color:var(--muted);
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}

.guest-link{
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.guest-link a{
  color:var(--primary);
  text-decoration:none;
  font-weight:700;
  transition:color .2s;
}

.guest-link a:hover{
  color:var(--primary2);
}

.error-message{
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.3);
  color:#ef4444;
  padding:10px 12px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:16px;
  display:none;
}

.error-message.show{
  display:block;
}

.theme-toggle-btn{
  position:absolute;
  top:20px;
  right:20px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  padding:6px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.theme-toggle-btn:hover{
  background:var(--primary);
  color:#fff;
}
</style>
</head>
<body>

<button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Modo Claro</button>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">🎬</div>
      <h1>Gratia</h1>
      <p>Clube de Cinema</p>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" class="input-box" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="input-box" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="divider">OU</div>

    <div class="guest-link">
      <a href="#" onclick="enterAsGuest(event)">Continuar como Visitante</a>
    </div>
  </div>
</div>

<script>
let currentTheme = localStorage.getItem('gratia_theme') || 'dark';
const presetUsers = ["rebeca", "rayane", "malena", "derp", "kamila", "mudsaga", "gui", "mylena"];

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('themeBtn');
  if(currentTheme === 'light') {
    btn.textContent = '🌙 Modo Escuro';
  } else {
    btn.textContent = '☀️ Modo Claro';
  }
}

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme();
  localStorage.setItem('gratia_theme', currentTheme);
}

function handleLogin(event) {
  event.preventDefault();
  const username = document.getElementById('username').value.toLowerCase().trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('errorMessage');

  // Simple validation - in production use proper authentication
  if (presetUsers.includes(username) && password.length >= 4) {
    // Store user session
    localStorage.setItem('gratia_current_user', username);
    localStorage.setItem('gratia_is_guest', 'false');
    
    // Initialize user profile if not exists
    const userProfiles = JSON.parse(localStorage.getItem('gratia_user_profiles') || '{}');
    if (!userProfiles[username]) {
      userProfiles[username] = {
        name: username,
        avatar: '',
        banner: '',
        bio: '',
        letterboxdLink: '',
        favoriteMovie: '',
        joinDate: new Date().toISOString()
      };
      localStorage.setItem('gratia_user_profiles', JSON.stringify(userProfiles));
    }
    
    window.location.href = 'index.html';
  } else {
    errorEl.textContent = 'Usuário não encontrado ou senha inválida';
    errorEl.classList.add('show');
    setTimeout(() => errorEl.classList.remove('show'), 4000);
  }
}

function enterAsGuest(event) {
  event.preventDefault();
  localStorage.setItem('gratia_current_user', 'guest');
  localStorage.setItem('gratia_is_guest', 'true');
  window.location.href = 'index.html';
}

applyTheme();
</script>
</body>
</html>
